<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NitrklShare — Create your account and start sharing">
  <title>Sign Up — NitrklShare</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="animated-bg"></div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/>
          </svg>
        </div>
        <h1>NitrklShare</h1>
        <p>Join the community. Start sharing.</p>
      </div>

      <div id="register-alert" class="alert error"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="display_name">Display Name</label>
          <input type="text" id="display_name" class="form-input" placeholder="Your Name" required>
          <div class="form-error" id="display_name-error"></div>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="choose_a_username" required>
          <div class="form-error" id="username-error"></div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required>
          <div class="form-error" id="password-error"></div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" class="form-input" placeholder="Re-enter your password" required>
          <div class="form-error" id="confirm_password-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="register-btn">
          <span class="spinner"></span>
          <span class="btn-text">Create Account</span>
        </button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="/">Sign in</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>

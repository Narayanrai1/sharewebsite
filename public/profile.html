<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NitrklShare — User Profile">
  <title>Profile — NitrklShare</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="animated-bg"></div>

  <div class="app-layout">
    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <a href="/dashboard.html" class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/>
          </svg>
        </div>
        <span>NitrklShare</span>
      </a>

      <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input type="text" id="search-input" placeholder="Search posts..." autocomplete="off">
      </div>

      <div class="profile-area">
        <div class="profile-avatar" id="nav-avatar" title="Profile">
          <span class="avatar-initial" id="nav-avatar-initial"></span>
        </div>
        <div class="profile-dropdown" id="profile-dropdown">
          <div class="dropdown-header">
            <div class="name" id="dropdown-name"></div>
            <div class="username" id="dropdown-username"></div>
          </div>
          <button class="dropdown-item" id="btn-my-profile">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            My Profile
          </button>
          <button class="dropdown-item danger" id="btn-logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Profile Header -->
      <div class="profile-header" id="profile-header">
        <div class="large-avatar" id="profile-large-avatar">
          <span id="profile-avatar-initial"></span>
        </div>
        <div class="profile-info">
          <h2 id="profile-display-name"></h2>
          <div class="username-text" id="profile-username"></div>
          <div class="bio-text" id="profile-bio"></div>
          <div class="profile-stats">
            <div class="profile-stat">
              <div class="stat-value" id="profile-posts-count">0</div>
              <div class="stat-label">Posts</div>
            </div>
            <div class="profile-stat">
              <div class="stat-value" id="profile-likes-count">0</div>
              <div class="stat-label">Total Likes</div>
            </div>
          </div>
          <div class="mt-md" id="edit-profile-area"></div>
        </div>
      </div>

      <!-- Edit Profile Form (hidden by default) -->
      <div id="edit-profile-form-container" class="hidden" style="margin-bottom: var(--space-xl);">
        <div style="background: var(--gradient-card); border: 1px solid var(--border-card); border-radius: var(--radius-xl); padding: var(--space-xl); box-shadow: var(--shadow-card);">
          <h3 style="font-family: var(--font-heading); margin-bottom: var(--space-lg);">Edit Profile</h3>
          <form id="edit-profile-form">
            <div class="form-group">
              <label for="edit-display-name">Display Name</label>
              <input type="text" id="edit-display-name" class="form-input" placeholder="Display Name">
            </div>
            <div class="form-group">
              <label for="edit-bio">Bio</label>
              <textarea id="edit-bio" class="form-input" placeholder="Tell us about yourself..." rows="3"></textarea>
            </div>
            <div class="form-group">
              <label for="edit-avatar">Avatar</label>
              <input type="file" id="edit-avatar" class="form-input" accept="image/*">
            </div>
            <div style="display:flex; gap: var(--space-md);">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <button type="button" class="btn btn-secondary" id="cancel-edit-profile">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <!-- User Posts -->
      <div class="section-header">
        <h2 id="posts-section-title">Posts</h2>
      </div>
      <div class="feed-grid" id="profile-posts-grid"></div>

      <div id="profile-empty" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <h3>No posts yet</h3>
        <p>This user hasn't shared anything yet.</p>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
